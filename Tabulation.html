<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marks Tabulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1b1f24;--mu:#5d6773;--bd:#dfe3e8;--ac:#1f5fbf;--ac2:#e6effc;--bad:#b3261e;--badbg:#fde8e7;--ok:#17703a;--okbg:#e3f4e8;--wn:#8a5a00;--wnbg:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8ebee;--mu:#9aa5b1;--bd:#333a43;--ac:#6ea3f5;--ac2:#203049;--bad:#ff8a80;--badbg:#3b1f1e;--ok:#79d49a;--okbg:#17301f;--wn:#f0c36a;--wnbg:#3a2e12}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8ebee;--mu:#9aa5b1;--bd:#333a43;--ac:#6ea3f5;--ac2:#203049;--bad:#ff8a80;--badbg:#3b1f1e;--ok:#79d49a;--okbg:#17301f;--wn:#f0c36a;--wnbg:#3a2e12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
#drop{border:2px dashed var(--bd);text-align:center;padding:26px 12px;cursor:pointer}
#drop.on{border-color:var(--ac);background:var(--ac2)}
button,select,input[type=search]{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 12px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}nav button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--bd);padding:5px 8px;text-align:center;white-space:nowrap}th{background:var(--ac2);position:sticky;top:0}
td.l,th.l{text-align:left}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.st{border:1px solid var(--bd);border-radius:8px;padding:8px 10px}.st b{display:block;font-size:20px}
.gA{color:var(--ok);font-weight:600}.gB{color:var(--ac);font-weight:600}.gC{color:var(--wn);font-weight:600}.gD,.gE,.bad{color:var(--bad);font-weight:600}
td.fail{background:var(--badbg)}.chip{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:1px 7px;margin:2px;font-size:12px}
.tag{padding:2px 8px;border-radius:99px;font-size:12px}.tok{background:var(--okbg);color:var(--ok)}.twn{background:var(--wnbg);color:var(--wn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.err{background:var(--badbg);color:var(--bad)}
.tt,.tt th,.tt td{font-family:Cambria,"Cambria Math",Georgia,"Times New Roman",serif}.tt th{background:#FFFFCC;color:#000;position:static;border-color:#000;font-weight:700}.tt th.sc{padding:6px 1px;vertical-align:bottom;width:30px;min-width:30px;font-size:12px}.tt .v{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;white-space:nowrap;line-height:1.15;text-align:center}.tt th.cl{font-size:15px}.tt .an td{background:#FFFFCC;font-weight:600;border-color:#999}.tt .an td.l{background:#FFFFCC}.tt .rd{color:#d00000;font-weight:700}.tt th.sch{font-size:18px;letter-spacing:.5px}.tt .pg{text-align:center;font-weight:700;border:0;padding-top:8px;background:transparent}.tt td{border-color:#999}
</style></head><body><main>
<h1>Marks Tabulator</h1>
<div class="mu">Upload a result sheet (.xlsx / .xls). Subjects, components, totals and grades are detected automatically — nothing is uploaded anywhere; all processing happens in your browser.</div>
<div id="drop" class="card"><b>Click or drop your Excel file here</b><div class="mu" id="fn">No file selected</div>
<input id="f" type="file" accept=".xlsx,.xls,.xlsm,.csv" hidden></div>
<div id="msg"></div><div id="app" hidden>
<nav id="nav"></nav><div id="view"></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clean=s=>String(s??'').replace(/\s+/g,' ').trim(),L=c=>XLSX.utils.encode_col(c);
const GR=[[91,'A1'],[81,'A2'],[71,'B1'],[61,'B2'],[51,'C1'],[41,'C2'],[32,'D'],[0,'E']],grade=p=>GR.find(g=>p>=g[0])[1];
const gc=g=>'g'+(g||'?')[0],r1=x=>Math.round(x*10)/10,avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const pv=v=>{if(typeof v==='number')return{v,ab:0};const s=clean(v);if(s!==''&&!isNaN(s))return{v:+s,ab:0};return{v:null,ab:/^(ab|abs|absent|a)$/i.test(s)?1:0}};
let D=null,tab='Columns';

function parse(ws){
 const rg=XLSX.utils.decode_range(ws['!ref']),R=rg.e.r+1,C=rg.e.c+1;
 const g=[...Array(R)].map((_,r)=>[...Array(C)].map((_,c)=>{const x=ws[XLSX.utils.encode_cell({r,c})];return x?x.v:null}));
 const h=g.map(r=>r.slice());           // header copy with merged cells expanded
 (ws['!merges']||[]).forEach(m=>{const v=g[m.s.r][m.s.c];for(let r=m.s.r;r<=m.e.r;r++)for(let c=m.s.c;c<=m.e.c;c++)h[r][c]=v});
 // 1) header row = row containing "Student Name"
 let nr=-1;for(let r=0;r<Math.min(R,40)&&nr<0;r++)if(h[r].some(v=>/^(student'?s?\s*name|name( of student)?)$/i.test(clean(v))))nr=r;
 if(nr<1)throw Error('Could not find a "Student Name" header below a subject-name row.');
 // 2) subject row = header row above it where the same label repeats across neighbouring columns
 //    (a subject name sits over several sub-columns). Counting distinct labels is NOT reliable:
 //    vertical merges (e.g. Grand Total / % / Pos spanning rows 1-3) copy labels into the sub-header row.
 const runScore=r=>{let n=0,len=0,prev='';for(let c=0;c<=C;c++){const lb=c<C?clean(h[r][c]):'';
   if(lb&&lb===prev)len++;else{if(len>=3)n++;len=lb?1:0}prev=lb}return n};
 let sr=-1,best=0;for(let r=0;r<nr;r++){const n=runScore(r);if(n>best){best=n;sr=r}}
 if(sr<0){best=-1;sr=0;for(let r=0;r<nr;r++){const n=new Set(h[r].filter(v=>clean(v)).map(clean)).size;if(n>best){best=n;sr=r}}}
 let cls='';for(let r=0;r<nr&&!cls;r++)if(r!==sr)cls=clean(h[r][0]);
 let term='';for(let r=0;r<nr&&!term;r++)for(let c=0;c<C;c++)if(/^term\b/i.test(clean(g[r][c]))){term=clean(g[r][c]);break}
 // 3) group consecutive columns sharing the same subject label
 const ident=[],groups=[];
 for(let c=0;c<C;c++){const lb=clean(h[sr][c]);
  if(!lb){if(clean(g[nr][c]))ident.push({c,name:clean(g[nr][c])});continue}
  const last=groups[groups.length-1];if(last&&last.name===lb&&last.end===c-1)last.end=c;else groups.push({name:lb,start:c,end:c})}
 const subjects=[],summ={};
 groups.forEach(gp=>{
  const cols=[];for(let c=gp.start;c<=gp.end;c++){
   const raw=[];for(let r=sr+1;r<nr;r++)if(h[r][c]!=null)raw.push(String(h[r][c]));
   const t=(raw.join(' ').trim()||clean(g[nr][c]))+'',m=t.match(/\s(\d+(?:\.\d+)?)\s*$/);
   cols.push({c,letter:L(c),max:m?+m[1]:null,name:clean(m?t.slice(0,m.index):t)||('Col '+L(c)),type:/grade/i.test(t)?'grade':/total/i.test(t)?'total':'comp'})}
  if(gp.end-gp.start>=2&&cols.some(x=>x.type==='total'))subjects.push({name:gp.name,cols,range:L(gp.start)+'–'+L(gp.end)});
  else{const n=gp.name,k=/pos|rank/i.test(n)?'pos':/attend/i.test(n)?'att':/%|percent/i.test(n)?'pct':/total/i.test(n)?'grand':n;summ[k]={c:gp.start,name:n,letter:L(gp.start)}}});
 if(!subjects.length)throw Error('No subject groups detected.');
 const ni=ident.find(x=>/name/i.test(x.name)&&!/father|mother|parent/i.test(x.name)).c;
 // 4) read students
 const st=[];
 for(let r=nr+1;r<R;r++){if(!clean(g[r][ni])||/^(total|average|max|highest)/i.test(clean(g[r][ni])))continue;
  const s={row:r+1,info:{},sub:{},file:{}};ident.forEach(x=>s.info[x.name]=g[r][x.c]);s.name=clean(g[r][ni]);
  subjects.forEach(sb=>{const o={comps:[],ab:0,total:null,fileTotal:null,grade:'',mis:false};
   sb.cols.forEach(cl=>{const x=g[r][cl.c];if(cl.type==='comp'){const p=pv(x);o.comps.push(p.v);o.ab+=p.ab}else if(cl.type==='total')o.fileTotal=pv(x).v;else o.grade=clean(x)==='-'?'':clean(x)});
   const nums=o.comps.filter(v=>v!=null),sum=nums.reduce((a,b)=>a+b,0);
   o.total=o.fileTotal!=null?o.fileTotal:(nums.length?sum:null);o.mis=o.fileTotal!=null&&nums.length>0&&Math.abs(sum-o.fileTotal)>.01;o.sum=sum;s.sub[sb.name]=o});
  Object.entries(summ).forEach(([k,v])=>s.file[k]=g[r][v.c]);st.push(s)}
 // 5) which subjects are actually offered (any numeric marks)
 subjects.forEach(sb=>{sb.offered=st.some(s=>s.sub[sb.name].total!=null);
  const t=sb.cols.find(x=>x.type==='total');sb.max=t&&t.max?t.max:sb.cols.filter(x=>x.type==='comp').reduce((a,b)=>a+(b.max||0),0)});
 const off=subjects.filter(s=>s.offered),max=off.reduce((a,b)=>a+b.max,0);
 st.forEach(s=>{off.forEach(sb=>{const o=s.sub[sb.name];o.pct=o.total==null?null:o.total/sb.max*100;if(!o.grade&&o.pct!=null)o.grade=grade(o.pct)});
  s.grand=off.reduce((a,sb)=>a+(s.sub[sb.name].total||0),0);s.pct=max?s.grand/max*100:0;s.grade=grade(s.pct);
  s.fails=off.filter(sb=>s.sub[sb.name].grade==='E').map(sb=>sb.name)});
 const dv=[...new Set(st.map(s=>s.grand))];   // dense ranking: ties share a rank, next rank has no gap
 st.forEach(s=>s.rank=1+dv.filter(x=>x>s.grand).length);
 return{sheet:'',cls,term,nr:nr+1,sr:sr+1,first:nr+2,last:st.length?st[st.length-1].row:0,ident,summ,subjects,off,max,st}}

// ---------- views ----------
function setTab(t){tab=t;render()}
function render(){
 $('#nav').innerHTML=['Columns','Tabulation','Subjects','Checks'].map(t=>`<button class="${t===tab?'on':''}" onclick="setTab('${t}')">${t==='Columns'?'Detected columns':t==='Tabulation'?'Tabulation':t==='Subjects'?'Subject analysis':'Data checks'}</button>`).join('')+'<button class="p" onclick="run(exp)" style="margin-left:auto">Export Excel</button><button class="p" onclick="run(expPdf)">Export PDF</button>';
 $('#view').innerHTML=({Columns:vCols,Tabulation:vTab,Subjects:vSub,Checks:vChk})[tab]()}
const gcell=(v,g)=>`${v==null?'–':r1(v)} <span class="${gc(g)}">${esc(g||'')}</span>`;
function vCols(){const d=D;
 return`<div class="card"><b>Auto-detection result</b><div class="mu">Sheet “${esc(d.sheet)}” · Class ${esc(d.cls||'—')} · Subject names in row ${d.sr} · column headings in row ${d.nr} · ${d.st.length} students in rows ${d.first}–${d.last}</div></div>
 <div class="card w"><table><tr><th class="l">Subject</th><th>Columns</th><th>Status</th><th class="l">Detected sub-columns (max marks · column)</th></tr>
 ${d.subjects.map(s=>`<tr><td class="l"><b>${esc(s.name)}</b></td><td>${s.range}</td><td><span class="tag ${s.offered?'tok':'twn'}">${s.offered?'Offered · /'+s.max:'No marks (skipped)'}</span></td>
 <td class="l">${s.cols.map(c=>`<span class="chip">${esc(c.name)}${c.max?' /'+c.max:''} · ${c.letter}${c.type!=='comp'?' ('+c.type+')':''}</span>`).join('')}</td></tr>`).join('')}</table></div>
 <div class="card"><b>Student details columns:</b> ${d.ident.map(i=>`<span class="chip">${esc(i.name)} · ${L(i.c)}</span>`).join('')}<br>
 <b>Summary columns in file:</b> ${Object.values(d.summ).map(i=>`<span class="chip">${esc(i.name)} · ${i.letter}</span>`).join('')||'none'}</div>`}
function sorted(){const m=$('#sort')?.value||'rank',q=($('#q')?.value||'').toLowerCase();
 let a=D.st.filter(s=>s.name.toLowerCase().includes(q));
 return a.sort(m==='name'?(x,y)=>x.name.localeCompare(y.name):m==='sno'?(x,y)=>x.row-y.row:(x,y)=>x.rank-y.rank||x.row-y.row)}
function vTab(){const d=D,n=d.st.length,pass=d.st.filter(s=>!s.fails.length).length,top=[...d.st].sort((a,b)=>a.rank-b.rank).slice(0,3);
 return`<div class="card stats"><div class="st">Students<b>${n}</b></div><div class="st">Subjects<b>${d.off.length}</b></div><div class="st">Max marks<b>${d.max}</b></div>
 <div class="st">Class average<b>${r1(avg(d.st.map(s=>s.pct)))}%</b></div><div class="st">No “E” grade<b>${pass}/${n}</b></div><div class="st">Toppers<b style="font-size:14px">${top.map(s=>esc(s.name)+' ('+r1(s.pct)+'%)').join('<br>')}</b></div></div>
 <div class="card"><div class="row"><input id="q" type="search" placeholder="Search student…" oninput="tb()"><select id="sort" onchange="tb()"><option value="rank">Sort: Rank</option><option value="sno">Sort: Roll order</option><option value="name">Sort: Name</option></select></div><div class="w" id="tbl" style="margin-top:10px"></div></div>`}
function tb(){const d=D,id=d.ident,ni=id.length;
 const nall=ni+d.off.reduce((a,b)=>a+b.cols.length,0)+4,head=`<table class="tt"><tr><th class="sch" colspan="${nall}">THE HIMALAYAN INTERNATIONAL SCHOOL</th></tr><tr><th colspan="${ni}">${esc(d.term||'')}</th>${d.off.map(b=>`<th colspan="${b.cols.length}">${esc(b.name)}</th>`).join('')}<th rowspan="3">Grand<br>Total<br>(${d.max})</th><th rowspan="3">%</th><th rowspan="3">Pos</th><th rowspan="3">Attendance</th></tr>
 <tr><th class="cl" colspan="${ni}">${esc(d.cls||'')}</th>${d.off.map(b=>b.cols.map(c=>`<th class="sc"><span class="v">${esc(c.name)}${c.max?'<br>'+c.max:''}</span></th>`).join('')).join('')}</tr>
 <tr>${id.map(x=>`<th>${esc(x.name)}</th>`).join('')}${d.off.map(b=>b.cols.map(c=>`<th>${c.type==='grade'?'G':'C'}</th>`).join('')).join('')}</tr>`;
 const body=sorted().map(s=>`<tr>${id.map(x=>`<td class="${/name/i.test(x.name)?'l':''}">${esc(s.info[x.name])}</td>`).join('')}${d.off.map(b=>{const o=s.sub[b.name];let k=0;return b.cols.map(c=>{
   if(c.type==='comp'){const v=o.comps[k++];return`<td>${v==null?(o.ab?'<span class="bad">Ab</span>':'–'):v}</td>`}
   if(c.type==='total')return`<td class="${o.grade==='E'?'fail':''}"><b>${o.total==null?'–':r1(o.total)}</b></td>`;
   return`<td class="${gc(o.grade)}">${esc(o.grade)}</td>`}).join('')}).join('')}
  <td class="${s.pct<33?'rd':''}"><b>${r1(s.grand)}</b></td><td class="${s.pct<33?'rd':''}">${r1(s.pct)}</td><td class="${s.pct<33?'rd':''}">${s.rank}</td><td>${esc(s.file.att??'')}</td></tr>`).join('');
 const AR=anRows(),tot=ni+d.off.reduce((a,b)=>a+b.cols.length,0)+4;
 const an=`<tr><th colspan="${tot}">SUBJECT ANALYSIS</th></tr>`+AR.map(r=>`<tr class="an"><td class="l" colspan="${ni}">${esc(r.label)}</td>${r.vals.map((v,i)=>`<td colspan="${d.off[i].cols.length}">${esc(v)}</td>`).join('')}<td colspan="4"></td></tr>`).join('');
 $('#tbl').innerHTML=head+body+an+`<tr><td class="pg" colspan="${nall}">Page 1 of 1</td></tr></table>`}
function anRows(){const S=D.off.map(subStats),f=g=>S.map(g);
 return[{label:'Appeared',vals:f(s=>s.n)},{label:'Absent / Ab marks',vals:f(s=>s.ab)},{label:'Average',vals:f(s=>r1(s.avg))},{label:'Highest',vals:f(s=>s.hi)},{label:'Lowest',vals:f(s=>s.lo)},{label:'Pass %',vals:f(s=>r1(s.pp)+'%')}]}
function subStats(sb){const v=D.st.filter(s=>s.sub[sb.name].total!=null),t=v.map(s=>s.sub[sb.name].total),hi=Math.max(...t),lo=Math.min(...t),dist={};GR.forEach(g=>dist[g[1]]=0);v.forEach(s=>dist[s.sub[sb.name].grade]=(dist[s.sub[sb.name].grade]||0)+1);
 const f=v.filter(s=>s.sub[sb.name].grade==='E').length;return{n:v.length,ab:D.st.filter(s=>s.sub[sb.name].ab).length,avg:avg(t),hi,lo,hiN:v.filter(s=>s.sub[sb.name].total===hi).map(s=>s.name),loN:v.filter(s=>s.sub[sb.name].total===lo).map(s=>s.name),f,pp:(v.length-f)/v.length*100,dist,
  comp:sb.cols.filter(c=>c.type==='comp').map((c,i)=>({n:c.name,max:c.max,a:avg(D.st.map(s=>s.sub[sb.name].comps[i]).filter(x=>x!=null))}))}}
function vSub(){return`<div class="card w"><table><tr><th class="l">Subject</th><th>Max</th><th>Appeared</th><th>With Ab</th><th>Average</th><th>Highest</th><th>Lowest</th><th>Pass %</th></tr>
 ${D.off.map(sb=>{const s=subStats(sb);return`<tr><td class="l"><b>${esc(sb.name)}</b></td><td>${sb.max}</td><td>${s.n}</td><td>${s.ab}</td><td>${r1(s.avg)}</td><td title="${esc(s.hiN.join(', '))}">${s.hi}<br><small>${esc(s.hiN[0])}${s.hiN.length>1?' +'+(s.hiN.length-1):''}</small></td><td title="${esc(s.loN.join(', '))}">${s.lo}<br><small>${esc(s.loN[0])}${s.loN.length>1?' +'+(s.loN.length-1):''}</small></td><td>${r1(s.pp)}%</td></tr>`}).join('')}</table></div>
 <div class="card w"><b>Average per component</b><table style="margin-top:8px"><tr><th class="l">Subject</th>${D.off[0].cols.filter(c=>c.type==='comp').map(c=>`<th>${esc(c.name)}</th>`).join('')}</tr>
 ${D.off.map(sb=>`<tr><td class="l">${esc(sb.name)}</td>${subStats(sb).comp.map(c=>`<td>${r1(c.a)} <small class="mu">/${c.max??'?'}</small></td>`).join('')}</tr>`).join('')}</table></div>`}
function issues(){const a=[];D.st.forEach(s=>{
 D.off.forEach(b=>{const o=s.sub[b.name];if(o.mis)a.push([s.name,b.name,'Total in file '+o.fileTotal+' ≠ sum of components '+o.sum]);
  b.cols.filter(c=>c.type==='comp').forEach((c,i)=>{const v=o.comps[i];if(v!=null&&c.max&&v>c.max)a.push([s.name,b.name,c.name+' = '+v+' exceeds max '+c.max])})});
 const fg=parseFloat(String(s.file.grand??'').split('/')[0]);if(!isNaN(fg)&&Math.abs(fg-s.grand)>.01)a.push([s.name,'Grand total','File '+fg+' vs calculated '+r1(s.grand)]);
 if(typeof s.file.pct==='number'&&Math.abs(s.file.pct-s.pct)>.11)a.push([s.name,'Percentage','File '+s.file.pct+' vs calculated '+r1(s.pct)]);
 if(typeof s.file.pos==='number'&&s.file.pos!==s.rank)a.push([s.name,'Position','File '+s.file.pos+' vs calculated '+s.rank])});return a}
function vChk(){const a=issues(),h=D.summ.grand&&/\((\d+)\)/.exec(D.summ.grand.name),n=h&&+h[1]!==D.max?`<p class="tag twn">Header says total ${h[1]}, but offered subjects add up to ${D.max}. The calculation uses ${D.max}.</p>`:'';
 return`<div class="card"><b>Re-calculation vs. values in your file</b>${n}<p>${a.length?`${a.length} difference(s) found:`:'<span class="tag tok">All totals, percentages and positions match the file.</span>'}</p>
 ${a.length?`<div class="w"><table><tr><th class="l">Student</th><th class="l">Item</th><th class="l">Issue</th></tr>${a.map(x=>`<tr>${x.map(y=>`<td class="l">${esc(y)}</td>`).join('')}</tr>`).join('')}</table></div>`:''}</div>`}

// ---------- export ----------
const SCHOOL='THE HIMALAYAN INTERNATIONAL SCHOOL',ordered=()=>[...D.st].sort((a,b)=>a.rank-b.rank||a.row-b.row);
const run=f=>f().catch(e=>{$('#msg').innerHTML=`<div class="card err">Export failed: ${esc(e.message)}</div>`});
async function saveFile(name,data,type){let dl=null;try{dl=await window.claude?.use('downloads')}catch(e){}
 if(dl){try{await dl.save({filename:name,data})}catch(e){}return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
const gF=(t,m)=>{const p=`${t}/${m}*100`;let f='"'+GR[GR.length-1][1]+'"';for(let i=GR.length-2;i>=0;i--)f=`IF(${p}>=${GR[i][0]},"${GR[i][1]}",${f})`;return`IF(${t}="","",${f})`};

async function exp(){
 const d=D,st=ordered(),ni=d.ident.length,wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Tabulation');
 wb.calcProperties={fullCalcOnLoad:true};
 const sub=d.off.flatMap(b=>b.cols.map(c=>({b,c}))),nc=ni+sub.length+4,A=n=>L(n-1);

 // column map
 let cc0=ni+1;const M=d.off.map(b=>{const m={b,start:cc0,comps:[],tot:null,grd:null};b.cols.forEach((c,k)=>{const n=cc0+k;if(c.type==='comp')m.comps.push(n);else if(c.type==='total'&&!m.tot)m.tot=n;else if(c.type==='grade'&&!m.grd)m.grd=n});cc0+=b.cols.length;return m});
 const GT=nc-3,PC=nc-2,PS=nc-1,R0=5,RL=4+st.length;
 // S.No column + Name column (for the SUBTOTAL serial formula)
 const snoI=d.ident.findIndex(x=>/^(s\.?\s*no\.?|sr\.?\s*no\.?|serial.*)$/i.test(x.name.trim())),
  nmI=d.ident.findIndex(x=>/name/i.test(x.name)&&!/father|mother|parent/i.test(x.name)),
  NM=A(nmI+1);

 d.off.forEach(b=>b.cols.forEach((c,k)=>{r1_.push(k?'':b.name);r2_.push(c.name+(c.max?'\n'+c.max:''));r3_.push(c.type==='grade'?'G':'C')}));
 r1_.push('Grand Total ('+d.max+')','%','Pos','Attendance');r2_.push('','','','');r3_.push('','','','');
 ws.addRows([[SCHOOL],r1_,r2_,r3_]);
 ws.mergeCells(1,1,1,nc);ws.mergeCells(2,1,2,ni);ws.mergeCells(3,1,3,ni);
 M.forEach(m=>{if(m.b.cols.length>1)ws.mergeCells(2,m.start,2,m.start+m.b.cols.length-1)});
 for(let q=0;q<4;q++)ws.mergeCells(2,GT+q,4,GT+q);
 for(let r=1;r<=4;r++)for(let c=1;c<=nc;c++){const x=ws.getCell(r,c);x.fill=YEL;x.border=box(BK);x.font={name:'Cambria',bold:true,size:r===1?16:r===4?10:11,color:{argb:'FF000000'}};x.alignment={horizontal:'center',vertical:'middle',wrapText:true};if(r===3&&c>ni&&c<=ni+sub.length)x.alignment={horizontal:'center',vertical:'middle',wrapText:true,textRotation:90};if(r===3&&c===1)x.font={name:'Cambria',bold:true,size:14}}
 // data rows with formulas
 const totSet=new Set(M.map(m=>m.tot));
 st.forEach((s,i)=>{const r=R0+i,row=d.ident.map(x=>s.info[x.name]??'');
  M.forEach(m=>{const o=s.sub[m.b.name];let k=0;m.b.cols.forEach(c=>row.push(c.type==='comp'?(()=>{const v=o.comps[k++];return v==null?(o.ab?'Ab':''):v})():c.type==='total'?(o.total??''):o.grade))});
  row.push('','','',s.file.att??'');
  const rr=ws.addRow(row);
  // serial number that renumbers itself when you filter
  if(snoI>=0)rr.getCell(snoI+1).value={formula:`IF(${NM}${r}="","",SUBTOTAL(103,$${NM}$${R0}:${NM}${r}))`,result:i+1};
  M.forEach(m=>{const o=s.sub[m.b.name],n=o.comps.filter(v=>v!=null).length;
   if(!m.comps.length||!m.tot||!(n||o.ab||o.total==null))return;
   const refs=m.comps.map(c=>A(c)+r).join(',');
   rr.getCell(m.tot).value={formula:`IF(COUNT(${refs})=0,"",SUM(${refs}))`,result:n?o.sum:''};
   if(m.grd)rr.getCell(m.grd).value={formula:gF(A(m.tot)+r,m.b.max),result:n?grade(o.sum/m.b.max*100):''}});
  const tr=M.filter(m=>m.tot).map(m=>A(m.tot)+r).join(',');
  rr.getCell(GT).value={formula:`SUM(${tr})`,result:r1(s.grand)};
  rr.getCell(PC).value={formula:`ROUND(${A(GT)}${r}/${d.max}*100,1)`,result:r1(s.pct)};
  rr.getCell(PS).value={formula:`SUMPRODUCT((${'$'+A(GT)}$${R0}:${'$'+A(GT)}$${RL}>${A(GT)}${r})/COUNTIF(${'$'+A(GT)}$${R0}:${'$'+A(GT)}$${RL},${'$'+A(GT)}$${R0}:${'$'+A(GT)}$${RL}))+1`,result:s.rank};
  rr.getCell(PC).numFmt='0.0';rr.getCell(GT).numFmt='0.0';
  rr.eachCell({includeEmpty:true},(x,c)=>{x.border=box(GY);const nm=c<=ni&&/name/i.test(d.ident[c-1].name);x.alignment={horizontal:nm?'left':'center',vertical:'middle'};if(totSet.has(c)||c===GT)x.font={bold:true}})});
 // conditional formatting (same colours as preview)
 const fnt=a=>({font:{bold:true,color:{argb:a}}});
 M.forEach(m=>{if(m.tot){const t=A(m.tot)+R0;ws.addConditionalFormatting({ref:`${A(m.tot)}${R0}:${A(m.tot)}${RL}`,rules:[{type:'expression',formulae:[`AND(ISNUMBER(${t}),${t}/${m.b.max}*100<32)`],style:{font:{bold:true,color:{argb:'FFB3261E'}},fill:{type:'pattern',pattern:'solid',bgColor:{argb:'FFFDE8E7'}}}}]})}
  if(m.grd){const g=A(m.grd)+R0;ws.addConditionalFormatting({ref:`${A(m.grd)}${R0}:${A(m.grd)}${RL}`,rules:[
   {type:'expression',formulae:[`LEFT(${g},1)="A"`],style:fnt('FF17703A')},{type:'expression',formulae:[`LEFT(${g},1)="B"`],style:fnt('FF1F5FBF')},
   {type:'expression',formulae:[`LEFT(${g},1)="C"`],style:fnt('FF8A5A00')},{type:'expression',formulae:[`OR(LEFT(${g},1)="D",LEFT(${g},1)="E")`],style:fnt('FFB3261E')}]})}
  m.comps.forEach(c=>ws.addConditionalFormatting({ref:`${A(c)}${R0}:${A(c)}${RL}`,rules:[{type:'cellIs',operator:'equal',formulae:['"Ab"'],style:fnt('FFB3261E')}]}))});
 ws.addConditionalFormatting({ref:`${A(GT)}${R0}:${A(PS)}${RL}`,rules:[{type:'expression',formulae:[`$${A(PC)}${R0}<33`],style:fnt('FFFF0000')}]});
 // subject analysis at the bottom (formulas)
 ws.addRow([]);
 const tr=ws.addRow(['SUBJECT ANALYSIS']);ws.mergeCells(tr.number,1,tr.number,nc);
 for(let c=1;c<=nc;c++){const x=tr.getCell(c);x.fill=YEL;x.border=box(BK);x.font={bold:true};x.alignment={horizontal:'center',vertical:'middle'}}
 const S=d.off.map(subStats),labels=['Appeared','Absent / Ab marks','Average','Highest','Lowest','Pass %'];let apRow=0;
 labels.forEach((lb,li)=>{const row=[lb,...Array(ni-1).fill('')];d.off.forEach(b=>{row.push('');for(let k=1;k<b.cols.length;k++)row.push('')});row.push('','','','');
  const rr=ws.addRow(row),n=rr.number;if(li===0)apRow=n;ws.mergeCells(n,1,n,ni);
  M.forEach((m,i)=>{if(!m.tot)return;const T=`${A(m.tot)}${R0}:${A(m.tot)}${RL}`,s=S[i],ap=A(m.start)+apRow;
   const f=[`COUNT(${T})`,`SUMPRODUCT(--((${m.comps.map(c=>`${A(c)}${R0}:${A(c)}${RL}="Ab"`).join(')+(')})>0))`,`IFERROR(ROUND(AVERAGE(${T}),1),0)`,`MAX(${T})`,`MIN(${T})`,`IFERROR(ROUND((${ap}-COUNTIF(${T},"<"&${m.b.max*0.32}))/${ap}*100,1),0)`][li];
   const res=[s.n,s.ab,r1(s.avg),s.hi,s.lo,r1(s.pp)][li];
   rr.getCell(m.start).value={formula:f,result:res};if(li===5)rr.getCell(m.start).numFmt='0.0"%"';
   if(m.b.cols.length>1)ws.mergeCells(n,m.start,n,m.start+m.b.cols.length-1)});
  ws.mergeCells(n,nc-3,n,nc);
  for(let c=1;c<=nc;c++){const x=rr.getCell(c);x.border=box(GY);x.font={bold:true};x.alignment={horizontal:c===1?'left':'center',vertical:'middle'};x.fill=YEL}});

 // ================= A4 AUTO-FIT LAYOUT =================
 // 1) base widths (Excel character units): equal width for same kind of column
 const PT=w=>(w*7+5)*.75;                         // column width -> points
 const base=[];
 d.ident.forEach((x,k)=>{const len=Math.max(...st.map(s=>String(s.info[x.name]??'').length),String(x.name).length*.6);
  base.push(k===snoI?5:k===nmI?Math.min(30,Math.max(16,len+2)):Math.min(14,Math.max(6,len+2)))});
 sub.forEach(({c})=>base.push(c.type==='total'?6:5));   // all components equal, all totals equal, all grades equal

 // 2) orientation: landscape for wide tables, portrait for narrow ones
 const sw=base.reduce((a,b)=>a+b,0),nb=base.length;

 const n=Math.max(5,Math.floor(avail/17));               // rows that fit at minimum height

 for(let r=R0;r<R0+tot;r++){const row=ws.getRow(r);row.height=rh;row.eachCell({includeEmpty:true},x=>{x.font={...(x.font||{}),name:'Cambria',size:fs}})}

  margins:{left:.25,right:.25,top:.4,bottom:.5,header:.2,footer:.25}};

async function expPdf(){

 const d=D,st=ordered(),ni=d.ident.length,{jsPDF}=window.jspdf;
 const ncomp=d.off.reduce((a,b)=>a+b.cols.length,0),nall=ni+ncomp+4,MG=8;
 // base widths (mm): same kind of column = same width
 const idb=d.ident.map(x=>/name/i.test(x.name)&&!/father|mother|parent/i.test(x.name)?32:/s\.?\s*no/i.test(x.name)?8:14),tb_=[14,10,8,16],cb=4.2;
 const bsum=idb.reduce((a,b)=>a+b,0)+ncomp*cb+tb_.reduce((a,b)=>a+b,0);

 const f=(W-2*MG)/bsum;                                  // one factor -> table fills the full page width
 const idw=idb.map(w=>w*f),tail=tb_.map(w=>w*f),cw=cb*f,fs=Math.max(4.5,Math.min(8,6.5*f));
 doc.setFont('times','bold');doc.setFontSize(fs);
 const RH=Math.max(...d.off.flatMap(b=>b.cols.map(c=>doc.getTextWidth(c.name))))+5;
 const ctype=[...d.ident.map(()=>({t:'id'})),...d.off.flatMap(b=>b.cols.map(c=>({t:c.type,b:b.name}))),{t:'grand'},{t:'pct'},{t:'pos'},{t:'att'}];
 const cs={};[...idw,...Array(ncomp).fill(cw),...tail].forEach((w,i)=>cs[i]={cellWidth:w});
 const head=[[{content:SCHOOL,colSpan:nall,styles:{fontSize:14,cellPadding:1.5}}],
  [{content:d.term||'',colSpan:ni},...d.off.map(b=>({content:b.name,colSpan:b.cols.length,styles:{fontSize:fs+1.5}})),{content:'Grand\nTotal\n('+d.max+')',rowSpan:3},{content:'%',rowSpan:3},{content:'Pos',rowSpan:3},{content:'Attendance',rowSpan:3}],
  [{content:d.cls||'',colSpan:ni,styles:{fontSize:10}},...d.off.flatMap(b=>b.cols.map(c=>({content:'',_rot:[c.name,c.max?String(c.max):''],styles:{minCellHeight:RH}})))],
  [...d.ident.map(x=>x.name),...d.off.flatMap(b=>b.cols.map(c=>c.type==='grade'?'G':'C'))]];
 const body=st.map(s=>{const row=d.ident.map(x=>String(s.info[x.name]??''));
  d.off.forEach(b=>{const o=s.sub[b.name];let k=0;b.cols.forEach(c=>row.push(c.type==='comp'?(()=>{const v=o.comps[k++];return v==null?(o.ab?'Ab':''):String(v)})():c.type==='total'?(o.total==null?'':String(r1(o.total))):o.grade))});
  row.push(String(r1(s.grand)),String(r1(s.pct)),String(s.rank),String(s.file.att??''));return row});
 body.push([{content:'SUBJECT ANALYSIS',colSpan:nall,title:true}]);
 anRows().forEach(r=>body.push([{content:r.label,colSpan:ni},...r.vals.map((v,i)=>({content:String(v),colSpan:d.off[i].cols.length})),{content:'',colSpan:4}]));
 const GC={A:[23,112,58],B:[31,95,191],C:[138,90,0],D:[179,38,30],E:[179,38,30]};
 const common={theme:'grid',margin:{top:MG,left:MG,right:MG,bottom:14},columnStyles:cs,
  styles:{font:'times',fontSize:fs,cellPadding:0.6,lineColor:[153,153,153],lineWidth:0.1,halign:'center',valign:'middle',textColor:[0,0,0],overflow:'hidden'},
  headStyles:{fillColor:[255,255,204],textColor:[0,0,0],fontStyle:'bold',lineColor:[0,0,0],lineWidth:0.2},
  didParseCell:h=>{if(h.section!=='body')return;const i=h.row.index,c=h.cell.styles;
   if(i>=st.length){c.fillColor=[255,255,204];c.fontStyle='bold';c.lineColor=[0,0,0];const rw=h.cell.raw;c.halign=(rw&&rw.title)?'center':(h.column.index<ni?'left':'center');return}
   const s=st[i],t=ctype[h.column.index],txt=h.cell.text.join('');
   if(t.t==='id'&&/name/i.test(d.ident[h.column.index].name))c.halign='left';
   if(t.t==='comp'&&txt==='Ab'){c.textColor=[179,38,30];c.fontStyle='bold'}
   if(t.t==='total'){c.fontStyle='bold';if(s.sub[t.b].grade==='E'){c.fillColor=[253,232,231];c.textColor=[179,38,30]}}
   if(t.t==='grade'&&txt){c.textColor=GC[txt[0]]||[0,0,0];c.fontStyle='bold'}
   if(t.t==='grand')c.fontStyle='bold';
   if(['grand','pct','pos'].includes(t.t)&&s.pct<33){c.textColor=[208,0,0];c.fontStyle='bold'}},
  didDrawCell:h=>{const r=h.cell.raw;if(h.section==='head'&&r&&r._rot){const ls=r._rot.filter(Boolean),c=h.cell,lh=fs*.43;
   doc.setFont('times','bold');doc.setFontSize(fs);doc.setTextColor(0,0,0);
   const x0=c.x+c.width/2-(ls.length-1)*lh/2+0.8;ls.forEach((t,k)=>doc.text(t,x0+k*lh,c.y+c.height-1.5,{angle:90}))}}};
 // measure the real header height with a head-only dry run, then discard that page

 // rows per page -> equal row height so rows fill the page exactly

 doc.autoTable({...common,head,body,startY:MG,bodyStyles:{minCellHeight:rh}});
 const np=doc.getNumberOfPages();for(let p=1;p<=np;p++){doc.setPage(p);doc.setFont('times','bold');doc.setFontSize(9);doc.setTextColor(0,0,0);doc.text(`Page ${p} of ${np}`,W/2,H-6,{align:'center'})}

async function load(file){const m=$('#msg');m.innerHTML='';$('#fn').textContent=file.name;
 try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});let err='';
  for(const n of wb.SheetNames){try{D=parse(wb.Sheets[n]);D.sheet=n;break}catch(e){D=null;err=e.message}}
  if(!D)throw Error(err);tab='Columns';$('#app').hidden=false;render()}
 catch(e){$('#app').hidden=true;m.innerHTML=`<div class="card err">Could not read this file: ${esc(e.message)}</div>`}}
const dz=$('#drop'),fi=$('#f');dz.onclick=()=>fi.click();fi.onchange=()=>fi.files[0]&&load(fi.files[0]);
dz.ondragover=e=>{e.preventDefault();dz.classList.add('on')};dz.ondragleave=()=>dz.classList.remove('on');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('on');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};
new MutationObserver(()=>{if(tab==='Tabulation'&&$('#tbl'))tb();}).observe($('#view'),{childList:true});
