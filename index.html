<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HIS Main Dashboard</title>
</head>
<body>

  <!-- Your existing index.html content goes above this section -->

<!-- ================= EXAMINATION DASHBOARD ================= -->
<section class="examination-dashboard-section" id="examination-dashboard">
  <div class="exam-dashboard-card">
    <div class="exam-dashboard-icon">📝</div>

    <div class="exam-dashboard-content">
      <span class="exam-dashboard-badge">STAFF PORTAL</span>
      <h2>Examination Dashboard</h2>
      <p>
        Access the Examination Dashboard for question paper checking,
        marking schemes, date sheets, results and examination-related work.
      </p>
    </div>

    <a href="exam_dash.html" class="exam-dashboard-btn">
      Open Examination Dashboard <span>→</span>
    </a>
  </div>
</section>

<style>
  .examination-dashboard-section {
    width: 100%;
    padding: 50px 20px;
  }

  .exam-dashboard-card {
    max-width: 1100px;
    margin: auto;
    padding: 30px;
    display: flex;
    align-items: center;
    gap: 24px;
    border-radius: 24px;
    background: linear-gradient(135deg, #092f61, #174f87);
    color: #fff;
    box-shadow: 0 15px 40px rgba(9, 47, 97, 0.20);
  }

  .exam-dashboard-icon {
    width: 76px;
    height: 76px;
    flex: 0 0 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 20px;
    background: #ffc928;
    font-size: 38px;
  }

  .exam-dashboard-content {
    flex: 1;
  }

  .exam-dashboard-badge {
    display: inline-block;
    margin-bottom: 7px;
    padding: 5px 10px;
    border-radius: 20px;
    background: rgba(255,255,255,.14);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .exam-dashboard-content h2 {
    margin: 0 0 7px;
    font-size: 28px;
  }

  .exam-dashboard-content p {
    margin: 0;
    color: rgba(255,255,255,.82);
    line-height: 1.6;
    font-size: 14px;
  }

  .exam-dashboard-btn {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    white-space: nowrap;
    padding: 14px 20px;
    border-radius: 12px;
    background: #ffc928;
    color: #092f61;
    text-decoration: none;
    font-weight: 700;
    transition: .25s ease;
  }

  .exam-dashboard-btn:hover {
    transform: translateY(-2px);
    background: #ffe07a;
  }

  .exam-dashboard-btn span {
    font-size: 20px;
  }

  @media (max-width: 750px) {
    .exam-dashboard-card {
      flex-direction: column;
      text-align: center;
    }

    .exam-dashboard-btn {
      width: 100%;
      justify-content: center;
    }
  }
</style>
<!-- ================= END EXAMINATION DASHBOARD ================= -->


  <!-- Your existing index.html content can continue below this section -->

</body>
</html>
