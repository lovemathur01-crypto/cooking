<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APAAR Dashboard</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f0f2f5;color:#1f2937}
header{padding:16px;max-width:960px;margin:0 auto}
h1{margin:0;font-size:1.35rem}
#stamp{color:#6b7280;font-size:.85rem;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:#1d4ed8;color:#fff;cursor:pointer}
button.sec{background:#e5e7eb;color:#111827}
button:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
main{max-width:960px;margin:0 auto;padding:0 16px 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:16px}
.card h2{margin:0 0 10px;font-size:1.1rem}
.nums{display:flex;justify-content:space-between;text-align:center;margin-bottom:12px}
.nums b{display:block;font-size:1.4rem}
.nums span{font-size:.78rem;color:#6b7280}
.track{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#43a047,#66bb6a);border-radius:99px;transition:width .6s ease}
.pct{font-size:.8rem;color:#6b7280;margin:6px 0 12px}
.card button{width:100%}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.78rem;white-space:nowrap}
.pill.done{background:#e8f5e9;color:#2e7d32}
.pill.pend{background:#ffebee;color:#c62828}
.stu{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:12px 14px;margin-bottom:10px}
.stu .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.stu .nm{font-weight:600}
.meta{font-size:.82rem;color:#4b5563;margin-top:6px;line-height:1.5}
.up{margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.up button{padding:7px 12px;font-size:.85rem}
.msg{font-size:.82rem;color:#6b7280}
.warn{border-radius:12px;padding:14px;margin:8px 0}
.warn.o{background:#fff3e0;color:#e65100}
.warn.r{background:#ffebee;color:#c62828}
.search{width:100%;padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;font:inherit;margin-bottom:12px}
</style>
</head>
<body>
<header>
  <h1 id="title">APAAR ID status</h1>
  <div id="stamp">Loading…</div>
  <div class="bar">
    <button id="btnRefresh">Refresh now</button>
    <button id="btnAuto" class="sec">Pause auto-refresh</button>
    <button id="btnBack" class="sec" hidden>Back to classes</button>
  </div>
</header>
<main id="app"></main>

<script>
// ══════════ CONFIG — the only things an admin should edit ══════════
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQQKb3JMosWsz5y6ONk_j2BIENmzESZKqDE8Tc6ChsVhtXt4RP22fi4AwA0DjNKGA/pub?gid=1123911021&single=true&output=csv";
const COL = {
  class:   "Class",
  section: "Section",
  name:    "Student Name",
  pen:     "Student PEN",
  gender:  "Gender",
  father:  "Father Name",
  mother:  "Mother Name",
  status:  "APAAR Generated Status"
};
const DONE_VALUES = ["yes","done","generated","y","✓","completed"];
const APPS_SCRIPT_API = "";   // paste Web App URL here to enable uploads
// ═══════════════════════════════════════════════════════════════════

const REFRESH_MS = 60000, MAX_BYTES = 10 * 1024 * 1024;
let students = [], view = null, auto = true, timer = null, lastError = null, updated = null, busy = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").trim().toLowerCase();
const isDone = v => DONE_VALUES.includes(norm(v));
const cmp = (a, b) => String(a).localeCompare(String(b), undefined, {numeric: true, sensitivity: "base"});

// ── CSV parser: quotes, "" escapes, commas and newlines inside cells ──
function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); rows.push(row); row = []; cell = "";
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function toStudents(rows) {
  const h = rows.findIndex(r => r.some(c => norm(c) === norm(COL.class)));
  if (h < 0) throw {missing: [COL.class]};
  const head = rows[h].map(norm);
  const idx = {}, missing = [];
  for (const k in COL) { idx[k] = head.indexOf(norm(COL[k])); if (idx[k] < 0) missing.push(COL[k]); }
  if (missing.length) throw {missing};
  const get = (r, k) => (r[idx[k]] ?? "").trim();
  return rows.slice(h + 1).filter(r => get(r, "class")).map(r => ({
    cls: get(r, "class"), sec: get(r, "section"), name: get(r, "name"), pen: get(r, "pen"),
    gender: get(r, "gender"), father: get(r, "father"), mother: get(r, "mother"),
    done: isDone(get(r, "status"))
  }));
}

async function load() {
  if (busy) return; busy = true;
  try {
    const sep = CSV_URL.includes("?") ? "&" : "?";
    const res = await fetch(CSV_URL + sep + "t=" + Date.now(), {cache: "no-store"});
    if (!res.ok) throw new Error("Could not load the sheet (HTTP " + res.status + ")");
    students = toStudents(parseCSV(await res.text()));
    lastError = null; updated = new Date();
  } catch (e) {
    lastError = e && e.missing ? {missing: e.missing} : {text: (e && e.message) || String(e)};
  }
  busy = false; render();
}

function render() {
  const app = $("app");
  $("stamp").textContent = updated
    ? "Updated: " + updated.toLocaleTimeString([], {hour12: false}) + " · " + students.length + " students"
    : "Loading…";
  $("btnBack").hidden = !view;
  $("title").textContent = view ? "Class " + view.cls + (view.sec ? " – " + view.sec : "") : "APAAR ID status";
  let html = "";
  if (lastError) {
    html += lastError.missing
      ? `<div class="warn o"><b>Some sheet columns were not found:</b> ${lastError.missing.map(esc).join(", ")}.<br>Check the header names in Row 1 of the sheet, or update the COL settings at the top of this file.</div>`
      : `<div class="warn r"><b>Could not load data.</b> ${esc(lastError.text)}</div>`;
  }
  if (!lastError && updated && !students.length) {
    html += `<div class="warn o"><b>No data found.</b> The sheet has a header but no student rows.</div>`;
  }
  app.innerHTML = html + (view ? listHTML() : dashHTML());
}

function dashHTML() {
  const g = {};
  students.forEach(s => { const k = s.cls + "\u0000" + s.sec; (g[k] = g[k] || {cls: s.cls, sec: s.sec, t: 0, d: 0}).t++; if (s.done) g[k].d++; });
  const list = Object.values(g).sort((a, b) => cmp(a.cls, b.cls) || cmp(a.sec, b.sec));
  return `<div class="grid">` + list.map((c, i) => {
    const p = c.t - c.d, pct = c.t ? Math.round(c.d / c.t * 100) : 0;
    return `<div class="card"><h2>Class ${esc(c.cls)}${c.sec ? " – " + esc(c.sec) : ""}</h2>
      <div class="nums"><div><b>${c.t}</b><span>Total</span></div><div><b style="color:#2e7d32">${c.d}</b><span>Done</span></div><div><b style="color:#c62828">${p}</b><span>Pending</span></div></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div>
      <div class="pct">${pct}% complete</div>
      <button data-i="${i}" data-cls="${esc(c.cls)}" data-sec="${esc(c.sec)}">View students</button></div>`;
  }).join("") + `</div>`;
}

let filter = "";
function listHTML() {
  const rows = students.filter(s => s.cls === view.cls && s.sec === view.sec).sort((a, b) => cmp(a.name, b.name));
  const f = norm(filter);
  const shown = f ? rows.filter(s => norm(s.name).includes(f) || norm(s.pen).includes(f)) : rows;
  const canUpload = !!APPS_SCRIPT_API;
  return `<input class="search" id="q" placeholder="Search by name or PEN" value="${esc(filter)}" aria-label="Search students">` +
    (shown.length ? shown.map(s => `<div class="stu"><div class="top"><div class="nm">${esc(s.name)}</div>
      <span class="pill ${s.done ? "done" : "pend"}">${s.done ? "✓ Generated" : "⏳ Pending"}</span></div>
      <div class="meta">PEN: ${esc(s.pen)} · ${esc(s.gender)}<br>Father: ${esc(s.father)}<br>Mother: ${esc(s.mother)}</div>
      ${canUpload && !s.done ? `<div class="up"><input type="file" accept="image/*,application/pdf" data-pen="${esc(s.pen)}" aria-label="Proof file for ${esc(s.name)}"><button data-up="${esc(s.pen)}">Upload and mark generated</button><span class="msg" data-msg="${esc(s.pen)}"></span></div>` : ""}
      </div>`).join("") : `<div class="warn o">No students match.</div>`);
}

// ── Upload (only when APPS_SCRIPT_API is set) ──
function toBase64(file) {
  return new Promise((ok, no) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1]);
    r.onerror = () => no(new Error("Could not read the file"));
    r.readAsDataURL(file);
  });
}
async function post(payload) {
  // text/plain avoids a CORS preflight, which Apps Script does not answer
  const res = await fetch(APPS_SCRIPT_API, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(payload)});
  return res.json();
}
async function upload(pen, btn) {
  const msg = document.querySelector(`[data-msg="${CSS.escape(pen)}"]`);
  const file = document.querySelector(`input[type=file][data-pen="${CSS.escape(pen)}"]`).files[0];
  const say = t => msg.textContent = t;
  if (!file) return say("Choose a file first.");
  if (!/^image\//.test(file.type) && file.type !== "application/pdf") return say("Only images or PDF files are allowed.");
  if (file.size > MAX_BYTES) return say("File is larger than 10 MB.");
  btn.disabled = true; say("Uploading…");
  try {
    const up = await post({action: "uploadDoc", pen, fileName: file.name, mimeType: file.type, data: await toBase64(file)});
    if (!up.success) throw new Error(up.error || "Upload failed");
    const mk = await post({action: "markGenerated", pen});
    if (!mk.success) throw new Error(mk.error || "Could not update status");
    say("Saved. Status updated."); await load();
  } catch (e) { say("Failed: " + e.message); btn.disabled = false; }
}

// ── Events ──
$("app").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.cls !== undefined) { view = {cls: b.dataset.cls, sec: b.dataset.sec}; filter = ""; render(); scrollTo(0, 0); }
  else if (b.dataset.up) upload(b.dataset.up, b);
});
$("app").addEventListener("input", e => {
  if (e.target.id === "q") { filter = e.target.value; const p = e.target.selectionStart; render(); const q = $("q"); q.focus(); q.setSelectionRange(p, p); }
});
$("btnBack").onclick = () => { view = null; render(); };
$("btnRefresh").onclick = load;
$("btnAuto").onclick = () => {
  auto = !auto; $("btnAuto").textContent = auto ? "Pause auto-refresh" : "Resume auto-refresh";
  clearInterval(timer); if (auto) { timer = setInterval(skipIfBusy, REFRESH_MS); load(); }
};
// Don't re-render while a teacher is choosing or uploading a file
function skipIfBusy() {
  const a = document.activeElement;
  if (a && a.type === "file") return;
  if ([...document.querySelectorAll("input[type=file]")].some(i => i.files.length)) return;
  load();
}
timer = setInterval(skipIfBusy, REFRESH_MS);
load();
</script>
</body>
</html>
