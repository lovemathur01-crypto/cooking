<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terminal</title>
<style>
:root{--bg:#0c0c0c;--panel:#111;--fg:#cfcfcf;--dim:#7d7d7d;--g:#16c60c;--amber:#f9c74f;--red:#e74856;--line:#2f2f2f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font-family:Consolas,"Cascadia Mono","Lucida Console","Courier New",monospace;color:var(--fg);font-size:13px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:#0c0c0c}::-webkit-scrollbar-thumb{background:#333;border:2px solid #0c0c0c}
.topbar{height:34px;background:#1f1f1f;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 0 0 12px;color:#bbb;font-size:12px;user-select:none}
.topbar .cur{display:inline-block;width:8px;height:14px;background:var(--g);vertical-align:-2px;margin-left:3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.wc{display:flex;height:100%}.wc i{width:46px;display:grid;place-items:center;font-style:normal;color:#aaa}.wc i:last-child:hover{background:#c42b1c;color:#fff}.wc i:hover{background:#333}
.layout{display:grid;grid-template-columns:400px 1fr;height:calc(100vh - 35px)}
.side{overflow-y:auto;padding:14px 14px 90px;background:var(--panel);border-right:1px solid var(--line)}
.card{border:1px solid var(--line);padding:12px 12px 2px;margin-bottom:14px;background:var(--bg)}
.card h2{margin:0 0 12px;font-size:13px;font-weight:400;color:var(--g);display:flex;gap:8px}
.card h2::before{content:"$";color:var(--dim)}
.step{color:var(--dim)}
.card h2 small{margin-left:auto;color:var(--dim);font-size:11px}
label{display:block;font-size:11.5px;color:var(--dim);margin:0 0 4px}
label::before{content:"--";margin-right:3px}
.field{margin-bottom:11px}
input[type=text],textarea,select{width:100%;border:1px solid #3a3a3a;border-radius:0;padding:7px 9px;font:13px Consolas,"Cascadia Mono","Courier New",monospace;color:var(--g);background:#000;outline:none;caret-color:var(--g)}
input::placeholder,textarea::placeholder{color:#4d4d4d}
input:focus,textarea:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 1px var(--g)}
select option{background:#000;color:var(--g)}
textarea{resize:vertical;line-height:1.5}
#raw{min-height:230px;font-size:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:1px solid #555;border-radius:0;background:transparent;color:var(--fg);padding:6px 11px;font:13px Consolas,"Cascadia Mono","Courier New",monospace;cursor:pointer}
button:hover{background:#222;border-color:#888}
.btn.danger{color:var(--red);border-color:#6b2b31}.btn.danger:hover{background:#2a1215}
.btn.primary{width:100%;color:var(--g);border-color:var(--g);padding:10px;font-size:14px}
.btn.primary:hover{background:var(--g);color:#000}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:6px 0}
.seg button.on{background:var(--g);border-color:var(--g);color:#000;font-weight:700}
.range{display:flex;align-items:center;gap:10px}
.range input[type=range]{flex:1;accent-color:var(--g)}
.range output{min-width:48px;text-align:right;color:var(--g)}
.actionbar{position:sticky;bottom:-90px;margin:0 -14px;padding:12px 14px;background:linear-gradient(#11111100,#111 30%)}
#status{font-size:12px;line-height:1.5;margin:4px 0 12px;color:var(--g)}
#status:not(:empty)::before{content:"> "}
#status.warn{color:var(--amber)}
.hint{font-size:11.5px;line-height:1.55;color:var(--dim);margin:0 0 12px}
.main{display:flex;flex-direction:column;min-width:0;height:100%}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;background:#141414;border-bottom:1px solid var(--line)}
.toolbar .title{margin-right:auto;color:var(--g)}
.toolbar .title span{color:var(--dim)}
.toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper span{min-width:50px;text-align:center;color:var(--g)}
.tb.exp{color:var(--g);border-color:var(--g)}.tb.exp:hover{background:var(--g);color:#000}
.stage{flex:1;overflow:auto;padding:22px;background:#060606}
.paper{--fs:12pt;width:210mm;min-height:297mm;margin:0 auto;background:#fff;padding:14mm 16mm 16mm;box-shadow:0 0 0 1px #333;color:#111;font-family:"Times New Roman",serif;font-size:var(--fs);line-height:1.4}
[contenteditable="true"]:focus{outline:1px dashed var(--g);outline-offset:3px}
@media(max-width:1000px){
  html,body{height:auto}
  .layout{display:block;height:auto}
  .side{overflow:visible}
  .main{height:auto}
  .stage{padding:10px;overflow:auto}
  .paper{width:100%;min-height:600px;padding:20px 16px}
}
@media print{
  body{background:#fff;height:auto}
  .topbar,.side,.toolbar{display:none!important}
  .layout{display:block;height:auto}
  .main{display:block;height:auto}
  .stage{padding:0;background:#fff;overflow:visible}
  .paper{width:auto;min-height:0;margin:0;box-shadow:none;padding:0}
}
</style>

<!-- Paper styles: every selector starts with ".paper " -->
<style id="paperCss">
.paper .school-name{text-align:center;font:bold 21pt Arial,sans-serif;color:#17385e;margin:0;letter-spacing:.3px}
.paper .school-line{text-align:center;font:10.5pt Arial,sans-serif;margin:3px 0}
.paper .school-line.dim{color:#222;font-size:7.8pt;white-space:nowrap}
.paper .paper-rule{border:0;border-top:2px solid #b18a3d;margin:8px 0}
.paper .exam-title{text-align:center;font:bold 15pt Arial,sans-serif;margin:8px 0 2px;text-transform:uppercase}
.paper .session-line{text-align:center;font:bold 12pt Arial,sans-serif;margin:0 0 10px}
.paper table{border-collapse:collapse}
.paper .meta{width:100%;font:11.5pt Arial,sans-serif;margin:4px 0 14px}
.paper .meta td{padding:3px 0;vertical-align:top}
.paper p.student{font:11pt Arial,sans-serif;margin:0 0 14px;white-space:nowrap}
.paper .instructions-title{font:bold 12pt Arial,sans-serif;margin:8px 0 6px}
.paper .instructions{margin:2px 0 8px;padding-left:22px}
.paper .sec{width:100%;margin:14px 0 6px;border-bottom:1.5px solid #17385e}
.paper .sec td{padding:3px 2px;font:bold .96em Arial,sans-serif;color:#17385e}
.paper .sec td.sm{text-align:right;white-space:nowrap;font-weight:normal;font-size:.9em}
.paper .q{width:100%;margin:0 0 7px;page-break-inside:avoid}
.paper .q td{vertical-align:top;padding:0}
.paper .qn{width:30px;font-weight:bold}
.paper .qm{width:50px;text-align:right;font-weight:bold;white-space:nowrap}
.paper .ln{margin:1px 0}
.paper .opts{width:100%;margin:2px 0 0}
.paper .opts td{width:50%;padding:1px 10px 1px 0}
.paper .opts.one td{width:100%}
.paper .match{width:92%;margin:5px 0 3px;border:1px solid #444}
.paper .match th,.paper .match td{border:1px solid #444;padding:3px 8px;text-align:left}
.paper .match th{background:#eef2f6;font-family:Arial,sans-serif;font-size:.85em}
.paper .note{margin:4px 0;font-style:italic}
.paper .end{text-align:center;font:9pt Arial,sans-serif;color:#555;border-top:1px solid #aaa;padding-top:4px;margin-top:18px}
</style>
<style id="printFoot"></style>
</head>

<div class="layout">

<script>
/* ================= helpers ================= */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function fmt(n){var x=Number(n);return isNaN(x)?String(n):String(Math.round(x*100)/100);}

/* The export tool leaves half-stripped "<div>" tags, e.g. "?diva. Cow. b. Ant/div". Turn them into line breaks. */
function cleanRaw(raw){
  var s=String(raw).replace(/\r/g,'').replace(/ /g,' ');
  s=s.replace(/<\/?div>/gi,'\n');
  s=s.replace(/(?:\/?div)+(?=[a-h]\s*[.)]|\s|$)/gi,'\n');
  return s;
}

/* ================= parser (pure) ================= */
var SEC_RE=/^\s*(\d+)\s*[.)]\s*([^\t(]*?)\s*[\t ]*\(\s*(\d+)\s*[x×*]\s*(\d+(?:\.\d+)?)\s*=\s*(\d+(?:\.\d+)?)\s*\)\s*$/i;
var SEC_ALT_RE=/^\s*((?:section|part)\s+[a-z0-9]+\b.*)$/i;
var OPT_RE=/^\(?([a-hA-H])\s*[.)]\s*(.*)$/;
var TAB_Q_RE=/^\s*(\d+)\.(?:[ ]*\t[\t ]*|[ ]*$)(.*)$/;
var PLAIN_Q_RE=/^\s*(?:Q(?:uestion)?\.?\s*)?(\d{1,3})\s*[.)]\s*(.*)$/i;
var TRAIL_TAB_MARK=/\t+\s*(\d+(?:\.\d+)?)\s*$/;
var ONLY_NUM=/^\d+(?:\.\d+)?$/;

function stripParenMark(s){
  var mark='';
  var t=s.replace(/\s*(?:\(\s*(\d+(?:\.\d+)?)\s*(?:marks?|m)?\s*\)|\[\s*(\d+(?:\.\d+)?)\s*(?:marks?|m)?\s*\]|\b(\d+(?:\.\d+)?)\s*M)\s*$/i,function(m,a,b,c){mark=a||b||c||'';return '';});
  return {text:t.trim(),mark:mark};
}
function parseHeaderLine(ln,info){
  var m;
  if((m=/Class\s*:\s*([^\t]+?)\s*(?:\t|\s{2,}|Exam\s*:|$)/i.exec(ln)))info.className=m[1].trim();
  if((m=/Exam\s*:\s*(.+?)\s*(?:\t|Subject\s*:|$)/i.exec(ln)))info.exam=m[1].trim();
  if((m=/Subject\s*:\s*(.+?)\s*$/i.exec(ln)))info.subject=m[1].trim();
  if((m=/MM\s*\/\s*PM\s*:\s*(\d+(?:\.\d+)?)\s*(?:\/\s*(\d+(?:\.\d+)?))?/i.exec(ln))){info.marks=m[1];if(m[2])info.time=m[2]+' Hours';}
  if((m=/Contact\s*No\.?\s*:\s*(.+?)\s*$/i.exec(ln)))info.contact=m[1].trim();
  if((m=/Email\s*:\s*(\S+)/i.exec(ln)))info.email=m[1].trim();
}

function parsePaper(raw){
  var text=cleanRaw(raw);
  var lines=text.split('\n');
  var tabMode=/^\s*\d+\.[ ]*\t/m.test(text);
  var info={},sections=[],sec=null,q=null,lastNum=0,qCount=0;

  function newSec(title,count,per,total){sec={title:title,count:count,per:per,total:total,qs:[],notes:[]};sections.push(sec);q=null;return sec;}
  function startQ(num,t,mark){
    if(!sec)newSec('',null,null,null);
    q={num:num,text:t,body:[],mark:mark||''};
    sec.qs.push(q);lastNum=Number(num);qCount++;
  }
  function addBody(t){
    var parts=t.split(/\s{2,}(?=\(?[a-hA-H]\s*[.)]\s*\S)/);
    var allOpts=parts.every(function(p){return OPT_RE.test(p.trim());});
    if(allOpts){parts.forEach(function(p){var m=OPT_RE.exec(p.trim());q.body.push({type:'opt',label:'('+m[1].toLowerCase()+')',text:m[2].trim()});});}
    else{q.body.push({type:'line',text:t});}
  }

  lines.forEach(function(ln){
    var m,t=ln.trim();
    if((m=SEC_RE.exec(ln))){newSec(m[2].replace(/[:.\-–—\s]+$/,'').trim(),Number(m[3]),Number(m[4]),Number(m[5]));return;}
    if(!t)return;
    if((m=SEC_ALT_RE.exec(t))&&!/^\d/.test(t)){newSec(m[1].replace(/[:\-–—\s]+$/,'').trim(),null,null,null);return;}
    var qm=null;
    if(tabMode){qm=TAB_Q_RE.exec(ln);}
    else{
      var pm=PLAIN_Q_RE.exec(ln);
      if(pm){var n=Number(pm[1]);if(!q||!sec||n===lastNum+1||(sec&&sec.qs.length===0))qm=pm;}
    }
    if(qm){
      var rest=qm[2],mark='';
      var tm=TRAIL_TAB_MARK.exec(rest);
      if(tm){mark=tm[1];rest=rest.replace(TRAIL_TAB_MARK,'');}
      if(!tabMode){var cm=stripParenMark(rest);rest=cm.text;if(cm.mark)mark=cm.mark;}
      rest=rest.trim().replace(/^Q\.?\s*\d+\s*[.):\-]?\s+/i,'');
      startQ(qm[1],rest,mark);return;
    }
    if(!sec){parseHeaderLine(ln,info);return;}
    if(q&&ONLY_NUM.test(t)){q.mark=t;return;}
    if(q){
      var mk=TRAIL_TAB_MARK.exec(ln);
      if(mk){q.mark=mk[1];t=ln.replace(TRAIL_TAB_MARK,'').trim();if(!t)return;}
      if(!tabMode){var c2=stripParenMark(t);t=c2.text;if(c2.mark)q.mark=c2.mark;}
      addBody(t);
    }else{sec.notes.push(t);}
  });

  var sum=0;sections.forEach(function(s){if(s.total!=null)sum+=s.total;});
  return {info:info,sections:sections,qCount:qCount,sum:sum,tabMode:tabMode};
}

/* ================= renderer (HTML string) ================= */
function renderQuestion(q,sec,o){
  var isMatch=/match/i.test(sec.title);
  var show=false;
  if(o.showMarks==='always')show=true;
  else if(o.showMarks==='auto')show=q.mark!==''&&(sec.per==null||Number(q.mark)!==sec.per);
  var mk=(show&&q.mark!=='')?'['+esc(fmt(q.mark))+']':'';
  var inner='';
  if(isMatch){
    var rows=[q.text].concat(q.body.map(function(b){return b.type==='opt'?(b.label+' '+b.text):b.text;})).filter(Boolean);
    inner='<div class="ln">Match the following:</div><table class="match"><tr><th>Column A</th><th>Column B</th></tr>'+rows.map(function(r){
      var c=r.split(/\t+|\s{2,}/).map(function(x){return x.trim();}).filter(Boolean);
      return '<tr><td>'+esc(c[0]||'')+'</td><td>'+esc(c.slice(1).join(' '))+'</td></tr>';
    }).join('')+'</table>';
  }else{
    if(q.text)inner+='<div class="ln">'+esc(q.text)+'</div>';
    var i=0;
    while(i<q.body.length){
      var b=q.body[i];
      if(b.type==='opt'){
        var group=[];
        while(i<q.body.length&&q.body[i].type==='opt'){group.push(q.body[i]);i++;}
        var long=group.some(function(g){return (g.label+' '+g.text).length>30;});
        var cells=group.map(function(g){return esc(g.label)+' '+esc(g.text);});
        var h='<table class="opts'+(long?' one':'')+'">';
        if(long){cells.forEach(function(c){h+='<tr><td>'+c+'</td></tr>';});}
        else{for(var k=0;k<cells.length;k+=2){h+='<tr><td>'+cells[k]+'</td><td>'+(cells[k+1]||'')+'</td></tr>';}}
        inner+=h+'</table>';
      }else{inner+='<div class="ln">'+esc(b.text)+'</div>';i++;}
    }
  }
  return '<table class="q"><tr><td class="qn">'+esc(q.num)+'.</td><td>'+inner+'</td><td class="qm">'+mk+'</td></tr></table>';
}

function renderPaper(model,v){
  var info=model.info;
  var meta='<table class="meta">'+
    '<tr><td style="width:38%"><b>Class:</b> '+esc(v.className||'—')+'</td><td style="width:34%"><b>Subject:</b> '+esc(v.subject||'—')+'</td><td style="text-align:right"><b>Set:</b> <span class="set-val">'+esc(v.set||'A')+'</span></td></tr>'+
    '<tr><td><b>Time:</b> '+esc(v.time||'—')+'</td><td>'+(v.date?'<b>Date:</b> '+esc(v.date):'')+'</td><td style="text-align:right"><b>Maximum Marks:</b> '+esc(v.marks||'—')+'</td></tr></table>';
  var NB='&nbsp;&nbsp;&nbsp;';
  var student='<p class="student"><b>Name:</b> ________________'+NB+'<b>Roll No.:</b> _______'+NB+'<b>Section:</b> ____'+NB+'<b>Invigilator\'s Sign:</b> _______</p>';
  var contact=[];if(info.contact)contact.push('Contact: '+info.contact);if(info.email)contact.push(info.email);
  var examT=(v.exam||'QUESTION PAPER');
  if(v.session)examT=examT.replace(/\s*\(?\s*(?:session\s*)?20\d\d\s*[-–—\/]\s*(?:20)?\d{2}\s*\)?\s*$/i,'')||examT;
  var head='<h1 class="school-name">THE HIMALAYAN INTERNATIONAL SCHOOL</h1>'+
    '<p class="school-line">Near Kotwali, By-pass Road, Vikasnagar, Dehradun, Uttarakhand – 248198</p>'+
    '<p class="school-line dim">Affiliated to CBSE, New Delhi · Affiliation No. 3530579'+(contact.length?' · '+esc(contact.join(' · ')):'')+'</p><hr class="paper-rule">'+
    '<h2 class="exam-title">'+esc(examT)+'</h2>'+
    (v.session?'<p class="session-line">(SESSION '+esc(v.session)+')</p>':'')+meta+student;
  var inst=(v.instructions||'').split('\n').map(function(x){return x.trim();}).filter(Boolean);
  var instHtml=inst.length?'<p class="instructions-title">General Instructions:</p><ol class="instructions">'+inst.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol>':'';
  var body='';
  model.sections.forEach(function(sec,si){
    if(sec.title||sec.total!=null){
      var L=String.fromCharCode(65+si);
      var label=sec.title?('Section '+L+' – '+esc(sec.title)):('Section '+L);
      var sm=sec.total!=null?'('+fmt(sec.count)+' × '+fmt(sec.per)+' = '+fmt(sec.total)+')':'';
      body+='<table class="sec"><tr><td>'+label+'</td><td class="sm">'+sm+'</td></tr></table>';
    }
    sec.notes.forEach(function(n){body+='<p class="note">'+esc(n)+'</p>';});
    sec.qs.forEach(function(q){body+=renderQuestion(q,sec,v);});
  });
  return head+instHtml+body+'<div class="end">— End of Question Paper —</div>';
}

/* ================= Word export: real .docx (editable paragraphs, real footer) ================= */
function xesc(s){return String(s).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function crc32(buf){
  var t=crc32.t;
  if(!t){t=crc32.t=[];for(var n=0;n<256;n++){var c=n;for(var k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}}
  var crc=0xFFFFFFFF;for(var i=0;i<buf.length;i++)crc=t[(crc^buf[i])&255]^(crc>>>8);
  return (crc^0xFFFFFFFF)>>>0;
}
function zipStore(files){
  var enc=new TextEncoder(),parts=[],central=[],offset=0;
  files.forEach(function(f){
    var name=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data),size=data.length;
    var lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,size,true);
    lh.setUint32(22,size,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),name,data);
    var ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,size,true);ch.setUint32(24,size,true);ch.setUint16(28,name.length,true);
    ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),name);
    offset+=30+name.length+size;
  });
  var cenSize=0;central.forEach(function(p){cenSize+=p.length;});
  var end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cenSize,true);end.setUint32(16,offset,true);
  return new Blob(parts.concat(central,[new Uint8Array(end.buffer)]),{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

function buildDocx(paper,fs,setName){
  var TEXTW=10206;                     /* A4 width minus 1.5cm margins, in twips */
  var BODY={font:'Times New Roman',sz:Math.round(fs*2)};
  var ARIAL=function(pt,extra){var o={font:'Arial',sz:Math.round(pt*2)};for(var k in extra)o[k]=extra[k];return o;};

  function rPr(rp){
    return '<w:rPr><w:rFonts w:ascii="'+rp.font+'" w:hAnsi="'+rp.font+'" w:cs="'+rp.font+'"/>'+(rp.b?'<w:b/>':'')+(rp.i?'<w:i/>':'')+
      (rp.color?'<w:color w:val="'+rp.color+'"/>':'')+'<w:sz w:val="'+rp.sz+'"/><w:szCs w:val="'+rp.sz+'"/>'+(rp.u?'<w:u w:val="single"/>':'')+'</w:rPr>';
  }
  function run(text,rp){if(rp.caps)text=text.toUpperCase();return '<w:r>'+rPr(rp)+'<w:t xml:space="preserve">'+xesc(text)+'</w:t></w:r>';}
  function tab(rp){return '<w:r>'+rPr(rp)+'<w:tab/></w:r>';}
  function runsFrom(node,rp){
    var x='';
    Array.prototype.forEach.call(node.childNodes,function(n){
      if(n.nodeType===3){if(n.textContent)x+=run(n.textContent,rp);}
      else if(n.nodeType===1){
        var t=n.tagName,r2=Object.assign({},rp);
        if(t==='BR'){x+='<w:r><w:br/></w:r>';return;}
        if(t==='B'||t==='STRONG')r2.b=true;
        if(t==='I'||t==='EM')r2.i=true;
        if(t==='U')r2.u=true;
        var st=n.getAttribute('style')||'';
        if(/font-weight:\s*(bold|[6-9]00)/.test(st))r2.b=true;
        if(/font-style:\s*italic/.test(st))r2.i=true;
        if(/text-decoration[^;]*underline/.test(st))r2.u=true;
        x+=runsFrom(n,r2);
      }
    });
    return x;
  }
  function para(inner,o){
    o=o||{};
    var p='<w:pPr>'+(o.keepNext?'<w:keepNext/>':'')+(o.keepLines?'<w:keepLines/>':'')+
      (o.border?'<w:pBdr><w:'+o.border.side+' w:val="single" w:sz="'+o.border.sz+'" w:space="'+(o.border.space||1)+'" w:color="'+o.border.color+'"/></w:pBdr>':'')+
      (o.tabs?'<w:tabs>'+o.tabs.map(function(t){return '<w:tab w:val="'+t[0]+'" w:pos="'+t[1]+'"/>';}).join('')+'</w:tabs>':'')+
      '<w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after==null?60:o.after)+'"/>'+
      (o.left||o.hanging?'<w:ind w:left="'+(o.left||0)+'"'+(o.hanging?' w:hanging="'+o.hanging+'"':'')+'/>':'')+
      (o.jc?'<w:jc w:val="'+o.jc+'"/>':'')+'</w:pPr>';
    return '<w:p>'+p+inner+'</w:p>';
  }
  var out=[];
  function qBlocks(cell){
    var b=[];
    Array.prototype.forEach.call(cell.childNodes,function(n){
      if(n.nodeType===3){if(n.textContent.trim()){var s=document.createElement('div');s.textContent=n.textContent.trim();b.push({t:'ln',node:s});}}
      else if(n.nodeType===1){
        if(n.tagName==='TABLE'&&/opts/.test(n.className))b.push({t:'opts',el:n});
        else if(n.tagName==='TABLE')b.push({t:'tbl',el:n});
        else b.push({t:'ln',node:n});
      }
    });
    return b;
  }
  function matchTable(tbl){
    var rows=Array.prototype.slice.call(tbl.rows),w=4500;
    var bd='<w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(function(s){return '<w:'+s+' w:val="single" w:sz="4" w:space="0" w:color="444444"/>';}).join('')+'</w:tblBorders>';
    var x='<w:tbl><w:tblPr><w:tblW w:w="'+(w*2)+'" w:type="dxa"/><w:tblInd w:w="567" w:type="dxa"/>'+bd+'<w:tblLayout w:type="fixed"/><w:tblCellMar><w:left w:w="100" w:type="dxa"/><w:right w:w="100" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid><w:gridCol w:w="'+w+'"/><w:gridCol w:w="'+w+'"/></w:tblGrid>';
    rows.forEach(function(tr){
      x+='<w:tr>';
      Array.prototype.forEach.call(tr.cells,function(td){
        var th=td.tagName==='TH';
        x+='<w:tc><w:tcPr><w:tcW w:w="'+w+'" w:type="dxa"/>'+(th?'<w:shd w:val="clear" w:color="auto" w:fill="EEF2F6"/>':'')+'</w:tcPr>'+
          para(runsFrom(td,th?Object.assign({},BODY,{b:true}):BODY),{after:20,before:20})+'</w:tc>';
      });
      x+='</w:tr>';
    });
    return x+'</w:tbl>'+para('',{after:40});
  }

  Array.prototype.forEach.call(paper.children,function(el){
    var tag=el.tagName,cl=String(el.className||'');
    if(tag==='H1')out.push(para(runsFrom(el,ARIAL(21,{b:true,color:'17385E'})),{jc:'center',after:0}));
    else if(/school-line/.test(cl))out.push(para(runsFrom(el,ARIAL(/dim/.test(cl)?7.8:10.5)),{jc:'center',after:/dim/.test(cl)?40:20}));
    else if(tag==='HR')out.push(para('<w:r>'+rPr(ARIAL(2))+'<w:t xml:space="preserve"> </w:t></w:r>',{border:{side:'bottom',sz:12,color:'B18A3D',space:1},after:100}));
    else if(tag==='H2')out.push(para(runsFrom(el,ARIAL(15,{b:true,caps:true})),{jc:'center',before:120,after:0}));
    else if(/session-line/.test(cl))out.push(para(runsFrom(el,ARIAL(12,{b:true})),{jc:'center',after:200}));
    else if(tag==='TABLE'&&/(^|\s)meta(\s|$)/.test(cl)){
      Array.prototype.forEach.call(el.rows,function(tr,ri){
        var rp=ARIAL(11.5),cells=Array.prototype.slice.call(tr.cells),x='';
        cells.forEach(function(td,i){if(i)x+=tab(rp);x+=runsFrom(td,rp);});
        out.push(para(x,{tabs:cells.length===2?[['right',TEXTW]]:[['left',3878],['right',TEXTW]],after:ri===el.rows.length-1?280:40}));
      });
    }
    else if(tag==='P'&&/(^|\s)student(\s|$)/.test(cl))out.push(para(runsFrom(el,ARIAL(11)),{after:240}));
    else if(/instructions-title/.test(cl))out.push(para(runsFrom(el,ARIAL(12,{b:true})),{before:120,after:100,keepNext:true}));
    else if(tag==='OL'){
      Array.prototype.forEach.call(el.children,function(li,i){
        out.push(para(run((i+1)+'.',BODY)+tab(BODY)+runsFrom(li,BODY),{left:794,hanging:397,tabs:[['left',794]],after:20}));
      });
      out.push(para('',{after:60}));
    }
    else if(tag==='TABLE'&&/(^|\s)sec(\s|$)/.test(cl)){
      var c=Array.prototype.slice.call(el.rows[0].cells);
      var sz=fs*0.96,x=runsFrom(c[0],ARIAL(sz,{b:true,color:'17385E'}));
      if(c[1]&&c[1].textContent.trim())x+=tab(ARIAL(sz))+runsFrom(c[1],ARIAL(sz*0.92,{color:'17385E'}));
      out.push(para(x,{tabs:[['right',TEXTW]],border:{side:'bottom',sz:12,color:'17385E',space:2},before:240,after:100,keepNext:true}));
    }
    else if(tag==='TABLE'&&/(^|\s)q(\s|$)/.test(cl)){
      var cells=Array.prototype.slice.call(el.rows[0].cells);
      var num=cells[0].textContent.trim(),mark=cells[2]?cells[2].textContent.trim():'';
      var blocks=qBlocks(cells[1]),first='';
      if(blocks.length&&blocks[0].t==='ln')first=runsFrom(blocks.shift().node,BODY);
      var more=blocks.length>0;
      out.push(para(run(num,Object.assign({},BODY,{b:true}))+tab(BODY)+first+(mark?tab(BODY)+run(mark,Object.assign({},BODY,{b:true})):''),
        {left:567,hanging:567,tabs:[['left',567],['right',TEXTW]],before:80,after:30,keepNext:more,keepLines:true}));
      blocks.forEach(function(b,bi){
        var kn=bi<blocks.length-1;
        if(b.t==='ln')out.push(para(runsFrom(b.node,BODY),{left:567,after:20,keepNext:kn,keepLines:true}));
        else if(b.t==='tbl')out.push(matchTable(b.el));
        else if(b.t==='opts'){
          var one=/(^|\s)one(\s|$)/.test(b.el.className),rows=Array.prototype.slice.call(b.el.rows);
          rows.forEach(function(tr,ri){
            var cs=Array.prototype.slice.call(tr.cells).filter(function(td,i){return i===0||td.textContent.trim();});
            var last=kn===false&&ri===rows.length-1;
            if(one||cs.length<2)out.push(para(runsFrom(cs[0],BODY),{left:567,after:10,keepNext:!last,keepLines:true}));
            else out.push(para(runsFrom(cs[0],BODY)+tab(BODY)+runsFrom(cs[1],BODY),{left:567,tabs:[['left',5500]],after:10,keepNext:!last,keepLines:true}));
          });
        }
      });
    }
    else if(/(^|\s)note(\s|$)/.test(cl))out.push(para(runsFrom(el,Object.assign({},BODY,{i:true})),{}));
    else if(/(^|\s)end(\s|$)/.test(cl))out.push(para(runsFrom(el,ARIAL(9,{color:'555555'})),{jc:'center',before:280,after:0}));
    else if(tag==='TABLE'){
      Array.prototype.forEach.call(el.rows,function(tr){
        var x='';Array.prototype.forEach.call(tr.cells,function(td,i){if(i)x+=tab(BODY);x+=runsFrom(td,BODY);});
        out.push(para(x,{}));
      });
    }
    else out.push(para(runsFrom(el,BODY),{}));
  });

  var NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  var XML='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  var doc=XML+'<w:document '+NS+'><w:body>'+out.join('')+
    '<w:sectPr><w:footerReference w:type="default" r:id="rId3"/><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="800" w:right="850" w:bottom="1100" w:left="850" w:header="400" w:footer="500" w:gutter="0"/></w:sectPr></w:body></w:document>';
  var FR=ARIAL(9,{color:'444444'});
  function fld(code){return '<w:fldSimple w:instr=" '+code+' "><w:r>'+rPr(FR)+'<w:t>1</w:t></w:r></w:fldSimple>';}
  var footer=XML+'<w:ftr '+NS+'><w:p><w:pPr><w:spacing w:before="0" w:after="0"/><w:jc w:val="center"/></w:pPr>'+
    run('Set '+setName+'   |   Page ',FR)+fld('PAGE')+run(' of ',FR)+fld('NUMPAGES')+'</w:p></w:ftr>';
  var styles=XML+'<w:styles '+NS+'><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Times New Roman" w:hAnsi="Times New Roman" w:cs="Times New Roman" w:eastAsia="Times New Roman"/><w:sz w:val="'+BODY.sz+'"/><w:szCs w:val="'+BODY.sz+'"/><w:lang w:val="en-IN"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="60" w:line="264" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style></w:styles>';
  var ct=XML+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>';
  var rels=XML+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>';
  var drels=XML+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>';
  return zipStore([
    {name:'[Content_Types].xml',text:ct},{name:'_rels/.rels',text:rels},
    {name:'word/document.xml',text:doc},{name:'word/styles.xml',text:styles},
    {name:'word/footer1.xml',text:footer},{name:'word/_rels/document.xml.rels',text:drels}
  ]);
}

if(typeof document!=='undefined'){
(function(){
  var $=function(id){return document.getElementById(id);};
  var autoFields=['exam','className','subject','time','marks'];
  var curSet='A';

  autoFields.forEach(function(id){$(id).addEventListener('input',function(){$(id).dataset.auto='';});});
  function setAuto(id,val){var el=$(id);if(val&&(el.value.trim()===''||el.dataset.auto==='1')){el.value=val;el.dataset.auto='1';}}

  /* font size */
  function setFs(v){
    v=Math.max(9,Math.min(16,Math.round(v*2)/2));
    $('paper').style.setProperty('--fs',v+'pt');
    $('fsRange').value=v;$('fsOut').textContent=v+' pt';$('fsLabel').textContent=v+' pt';
  }
  function getFs(){return parseFloat($('fsRange').value)||12;}
  $('fsRange').addEventListener('input',function(){setFs(parseFloat(this.value));});
  $('fsMinus').addEventListener('click',function(){setFs(getFs()-0.5);});
  $('fsPlus').addEventListener('click',function(){setFs(getFs()+0.5);});

  /* set A-D */
  function updatePrintFooter(){
    $('printFoot').textContent='@media print{@page{size:A4;margin:14mm 15mm 18mm;@bottom-center{content:"Set '+curSet+'   |   Page " counter(page) " of " counter(pages);font:9pt Arial,sans-serif;color:#444}}}';
  }
  function setSet(s){
    curSet=s;
    Array.prototype.forEach.call(document.querySelectorAll('#setSeg button'),function(b){b.classList.toggle('on',b.dataset.set===s);});
    Array.prototype.forEach.call(document.querySelectorAll('#paper .set-val'),function(e){e.textContent=s;});
    updatePrintFooter();
  }
  Array.prototype.forEach.call(document.querySelectorAll('#setSeg button'),function(b){b.addEventListener('click',function(){setSet(b.dataset.set);});});

  function values(model){
    setAuto('exam',model.info.exam);setAuto('className',model.info.className);setAuto('subject',model.info.subject);
    setAuto('time',model.info.time);setAuto('marks',model.info.marks||(model.sum?fmt(model.sum):''));
    return {exam:$('exam').value.trim(),session:$('session').value.trim(),className:$('className').value.trim(),subject:$('subject').value.trim(),
      time:$('time').value.trim(),marks:$('marks').value.trim(),date:$('date').value.trim(),set:curSet,
      showMarks:$('showMarks').value,instructions:$('instructions').value};
  }

  function formatNow(){
    var raw=$('raw').value,st=$('status');st.className='';st.textContent='';
    if(!raw.trim()){alert('no input');return;}
    var model=parsePaper(raw),v=values(model);
    $('paper').innerHTML=renderPaper(model,v);
    var msg='parsed '+model.sections.length+' block(s), '+model.qCount+' item(s).',warn=false;
    if(!model.qCount){msg='no numbered items detected. expected "1."+Tab, or "1." / "Q1." followed by text.';warn=true;}
    else if(model.sum&&v.marks&&Number(v.marks)!==model.sum){msg+=' warning: block totals = '+fmt(model.sum)+', max = '+esc(v.marks)+'.';warn=true;}
    st.innerHTML=msg;if(warn)st.className='warn';
  }

  $('formatBtn').addEventListener('click',formatNow);
  $('sampleBtn').addEventListener('click',function(){$('raw').value=SAMPLE;formatNow();});
  $('fileBtn').addEventListener('click',function(){$('fileIn').click();});
  $('fileIn').addEventListener('change',function(e){
    var f=e.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){$('raw').value=r.result;formatNow();};r.readAsText(f);e.target.value='';
  });
  $('clearBtn').addEventListener('click',function(){
    if(!confirm('clear input and output?'))return;
    $('raw').value='';$('status').textContent='';
    autoFields.forEach(function(id){if($(id).dataset.auto==='1'){$(id).value='';$(id).dataset.auto='';}});
    $('paper').innerHTML=placeholder();
  });
  $('printBtn').addEventListener('click',function(){updatePrintFooter();window.print();});
  $('boldBtn').addEventListener('click',function(){document.execCommand('bold');$('paper').focus();});
  $('undoBtn').addEventListener('click',function(){document.execCommand('undo');$('paper').focus();});

  $('wordBtn').addEventListener('click',function(){
    var cls=($('className').value.trim()||'X').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'')||'X';

    var blob=buildDocx($('paper'),getFs(),curSet);
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  });

  function placeholder(){
    return '<p style="text-align:center;color:#999;font-family:Consolas,monospace;margin-top:40mm">awaiting input_</p>';
  }
  $('paper').innerHTML=placeholder();
  setFs(12);updatePrintFooter();
  window.__app={formatNow:formatNow,setSet:setSet,setFs:setFs,getFs:getFs};
})();
}
